<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body
    class="min-h-screen min-w-[1000px] bg-[#101714] font-sans text-[#f0fdf4]"
  >
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header
        class="flex h-24 shrink-0 items-center justify-between border-b border-[#c5d9bd]/10"
      >
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#c5d9bd]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#c5d9bd] transition-colors hover:border-[#c5d9bd]/35 hover:bg-[#c5d9bd]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#c5d9bd] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span
          class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#c5d9bd]/65"
          >The everyday collection / 04</span
        >
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div
          class="flex w-[620px] h-[551px] rounded-3xl p-[40px] flex-col bg-[#19231E8C] border border-[#FFFFFF26]"
        >
          <div class="flex justify-between mb-[28px]">
            <div
              class="flex justify-center items-center w-[44px] h-[44px] rounded-xl bg-[#B5CBB21A]"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-timer preview-icon"
              >
                <line x1="10" x2="14" y1="2" y2="2" />
                <line x1="12" x2="15" y1="14" y2="11" />
                <circle cx="12" cy="14" r="8" />
              </svg>
            </div>
            <div
              id="Ready"
              class="flex justify-center items-center w-[62px] h-[29px] rounded-[12px] bg-[#B5CBB21A] text-[12px] text-[#C5D9BD]"
            >
              Ready
            </div>
          </div>
          <div class="text-[40px] text-[#F0FDF4] mb-[8px]">Stopwatch</div>
          <div class="text-[14px] text-[#A4B9AD]">
            make time for what matters
          </div>
          <div
            class="w-[540px] border border-[#B5CBB226] mb-[36px] mt-[36px]"
          ></div>
          <div class="flex w-[540px] ">
            <div class="flex flex-col w-[166px] items-center justify-center gap-[16px ]">
              <div id="Hours" class="text-[56px] text-[#EDF3E8]">00</div>
              <div class="text-[9px] text-[#9BAD9E]">HOURS</div>
            </div>
            <div class="text-[56px]  w-[20px] text-[#5C7161]">:</div>

            <div class="flex  w-[166px]  flex-col items-center justify-center gap-[16px ]">
              <div id="Minutes" class="text-[56px] text-[#EDF3E8]">00</div>
              <div class="text-[9px] text-[#9BAD9E]">MINUTES</div>
            </div>
            <div class="text-[56px]  w-[20px] text-[#5C7161]">:</div>

            <div class="flex flex-col items-center    w-[166px]  justify-center gap-[16px ]">
              <div id="Seconds" class="text-[56px] text-[#EDF3E8]">00</div>
              <div class="text-[9px] text-[#9BAD9E]">SECONDS</div>
            </div>
          </div>
          <div
            class="w-[540px] border border-[#B5CBB226] mb-[36px] mt-[36px]"
          ></div>
          <div class="flex gap-[12px]">
            <div>
              <button
                id="Start"
                type="button"
                class="cursor-pointer flex justify-center items-center w-[258px] h-[48px] rounded-xl bg-[#B5CBB2] text-[14px] text-[#102418] disabled:cursor-not-allowed disabled:opacity-35"
              >
                Start
              </button>
            </div>
            <div>
              <button
                disabled
                id="Pause"
                type="button"
                class="cursor-pointer flex justify-center items-center w-[129px] h-[48px] rounded-xl bg-[#FFFFFF0D] border-[#FFFFFF1A] border text-[14px] text-[#DCECE2] disabled:cursor-not-allowed disabled:opacity-35"
              >
                Pause
              </button>
            </div>
            <div>
              <button
                disabled
                id="Reset"
                type="button"
                class="cursor-pointer flex justify-center items-center w-[129px] h-[48px] rounded-xl bg-[#FFFFFF0D] border-[#FFFFFF1A] border text-[14px] text-[#DCECE2] disabled:cursor-not-allowed disabled:opacity-35"
              >
                Reset
              </button>
            </div>
          </div>
          <div class="flex justify-center text-[12px] text-[#8AA294] mt-[20px]">
            A moment of focus. At your own pace
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
